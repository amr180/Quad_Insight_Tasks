<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quad Insight | جميع المستخدمين</title>
    <link rel="stylesheet" href="/StylePages/quad-loader.css">
    <link rel="stylesheet" href="/StylePages/ViewUsers.css">
</head>
<body>
    <noscript>الرجاء تفعيل الجافا سكريبت لعرض الموقع بشكل صحيح</noscript>

    <!-- Quad Insight Global Loader -->
    <div id="global-loader">
        <div class="loader-card">
            <div class="logo-grid">
                <div class="square sq-1"></div>
                <div class="square sq-2"></div>
                <div class="square sq-3"></div>
                <div class="square sq-4"></div>
            </div>
            <h1 class="brand-title">Quad <span>Insight</span></h1>
            <p class="status-message" id="statusMessage">جاري بدء التشغيل...</p>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="percentage-indicator" id="percentageIndicator">0%</div>
        </div>
    </div>

    <header class="title">
        <h3>جميع المستخدمين</h3>
    </header>
    <aside>
        <img class="sidebar-logo" src="/Images/quad_insight_logo.jpeg" alt="quad-logo">
        <p>نظام إدارة المهام</p>
        <ul class="nav-items">
            <li>
                <a href="/htmlpages/Dashboard.html">لوحة التحكم</a>
            </li>
            <li>
                <a href="/htmlpages/ViewUsers.html">عرض كل المستخدمين </a>
            </li>
            <li>
                <a href="/htmlpages/CompletedTasks.html"> المهام المكتملة</a>
            </li>
            <li>
                <a href="/htmlpages/PendingTasks.html">المهام قيدالانتظار</a>
            </li>
        </ul>
    </aside>
    <article>
        <form>
            <fieldset>
                <legend><h3>عرض كل المستخدمين</h3></legend>
            </fieldset>
        </form>
    </article>

    <script src="/Scripts/quad-loader.js"></script>
</body>
</html>

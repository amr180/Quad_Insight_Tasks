<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="TaskManagement" content="width=device-width, initial-scale=1.0">
    <title>TaskManagement</title>
</head>

<header>
    
<img src=".../../Images/quad_insight_logo.jpeg" alt="loge of quad_insight"  >  
<p><strong>Task Management System</strong></p> 

</header>

<nav>
<ul class="Dashboard">
    <li>Dashboard</li>
</ul>
</nav>
<aside>
<img src=".../../Images/quad_insight_logo.jpeg"  alt="loge of quad_insight">
<p class="quote_sidbar">Dashboard — Your work, at a glance</p>
    <ul class="sidbar">
        <li>Dashboard</li>
        <li>Show All Users</li>
        <li>Show Completed Tasks</li>
        <li>Show Pinding Tasks</li>
    </ul>
</aside>

<body>

    <div id="usersContainer"></div>
    <button id="addUserBtn">
    + Add User
    </button>

<div id="userModal" class="modal">

    <div class="modal-content">

        <h2>Add New User</h2>

        <input
            type="text"
            id="userName"
            placeholder="User Name">

        <input
            type="email"
            id="userEmail"
            placeholder="Email">

    </div>
    <h3>Tasks</h3>

<div id="mainTasksContainer"></div>

<button id="addMainTaskBtn">
    + Add Main Task
</button>
<div class="modal-actions">

    <button id="cancelUserBtn">
        Cancel
    </button>

    <button id="saveUserBtn">
        Add User
    </button>

</div>
</div>

</body>

<footer>
    <figure>
<img src=".../../Images/quad_insight_logo.jpeg" alt="loge of quad_insight"  >  <figcaption>Founded in 2021, Quad Insight started with a vision to simplify and elevate veterinary operations. We launched VetICare as a desktop solution for clinics to streamline their workflows, simplify client communication, and reduce manual paperwork.</figcaption>
</figure>

</footer>
</html>

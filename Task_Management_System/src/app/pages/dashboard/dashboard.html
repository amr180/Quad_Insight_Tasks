<main class="main-content">
    <header class="page-header">
        <h1>مرحباً بك يا قائد</h1>
    </header>

    <section class="card-form">
        <form #addUserForm (submit)="onAddUserSubmit(addUserForm, $event)">
            <fieldset>
                <legend><h2>إضافة مستخدم جديد</h2></legend>

                <div class="form-group">
                    <label for="userName">اسم المستخدم</label>
                    <input type="text" id="userName" class="form-control" name="addname" placeholder="أدخل اسم المستخدم" required>
                </div>

                <div class="form-group">
                    <label for="userEmail">البريد الإلكتروني</label>
                    <input type="email" id="userEmail" class="form-control" name="useremail" placeholder="name@example.com" required>
                </div>
                <div class="form-actions">
                    <input type="reset" id="cancel" class="btn-cancel" value="إلغاء">
                    <input type="submit" id="save" class="btn-save" value="حفظ المستخدم">
                </div>

                <hr style="border: none; border-top: 1px solid var(--border-color); margin: 20px 0;">

                <h3 style="font-size: 16px; color: var(--primary-color);">مهام المستخدم</h3>
                <button type="button" class="btn-secondary-action" (click)="openTaskModal()">+ إضافة مهمة رئيسية</button>

                <div class="highlight-box">
                    اضغط على زر "إضافة مهمة رئيسية" لإضافة مهام جديدة للمستخدمين
                </div>
            </fieldset>
        </form>
    </section>
</main>

<!-- modal -->
<div class="modal-overlay" [class.active]="isTaskModalOpen" (click)="onOverlayClick($event)">
    <div class="modal">
        <button class="modal-close" (click)="closeTaskModal()">×</button>

        <div class="modal-header">
            <h2>Add New Task</h2>
            <p>Create a new task and assign it to a user.</p>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label>Task Name</label>
                <input type="text" id="taskName" placeholder="Enter task name" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="taskDescription" rows="4" placeholder="Enter task description" required></textarea>
            </div>

            <div class="form-group">
                <!-- كدا كدا هيتسجل اتومتك -->
                <label>Due Date</label>
                <input type="date" id="dueDate">
            </div>
            <div class="form-group">
                <label>Assign To</label>

                <select id="taskUser">

                    <option value="">Select User</option>

                    <option value="1">Ahmed Mohamed</option>

                    <option value="2">Mohamed Ali</option>

                    <option value="3">Omar Hassan</option>

                </select>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary" (click)="closeTaskModal()">Cancel</button>
            <button class="btn btn-primary" id="addTaskBtn">Add Task</button>
        </div>
    </div>
</div>

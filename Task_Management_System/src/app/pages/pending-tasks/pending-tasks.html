<main class="main-content">
    <header class="page-header">
        <h1>المهام قيد التنفيذ والانتظار</h1>
    </header>

    <section class="card-form">
        <div class="card-head">
            <h2>قائمة المهام قيد الانتظار</h2>
            <span>قيد العمل</span>
        </div>

        @for (task of tasks; track task.title) {
            <div class="task-card">
                <div class="task-assignee">
                    <div class="avatar">{{ task.assigneeInitials }}</div>
                    <div class="assignee-info">
                        <h4>{{ task.assigneeName }}</h4>
                    </div>
                </div>
                <div class="task-content">
                    <h3>{{ task.title }}</h3>
                    <p>{{ task.description }}</p>
                </div>
            </div>
        }
    </section>
</main>

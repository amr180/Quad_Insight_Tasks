<main class="main-content">
    <header class="page-header">
        <h1>سجل المهام المكتملة</h1>
    </header>

    <section class="card-form">
        <div>
            <h2>قائمة المهام المكتملة</h2>
            <span>جاهزة ومكتملة</span>
        </div>

        @for (task of tasks; track task.title) {
            <div class="task-card">
                <div class="task-assignee">
                    <div class="avatar">{{ task.assigneeInitials }}</div>
                    <div class="assignee-info">
                        <h4>{{ task.assigneeName }}</h4>
                    </div>
                </div>
                <div class="task-content">
                    <h3>{{ task.title }}</h3>
                    <div class="subtasks">
                        @for (subtask of task.subtasks; track subtask) {
                            <p>{{ subtask }}</p>
                        }
                    </div>
                </div>
            </div>
        }
    </section>
</main>
